<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>면접 일정 선택 | 엘앤티렉서스(주)</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard',-apple-system,sans-serif;background:#F5F4F0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:#fff;border-radius:16px;padding:40px;max-width:480px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,.1)}
  .logo{font-size:13px;font-weight:600;color:#534AB7;margin-bottom:24px}
  h1{font-size:22px;font-weight:700;color:#1a1a1a;margin-bottom:8px}
  .sub{font-size:14px;color:#666;margin-bottom:28px;line-height:1.6}
  .slot{border:2px solid #E8E7E2;border-radius:12px;padding:16px 20px;margin-bottom:12px;cursor:pointer;transition:all .2s}
  .slot:hover{border-color:#534AB7;background:#FAFAFE}
  .slot.selected{border-color:#534AB7;background:#EEEDFE}
  .slot-date{font-size:16px;font-weight:700;color:#1a1a1a;margin-bottom:4px}
  .slot-time{font-size:15px;color:#534AB7;font-weight:600}
  .slot-location{font-size:13px;color:#666;margin-top:4px}
  .slot-check{display:none;color:#534AB7;font-size:18px;margin-left:auto}
  .slot.selected .slot-check{display:block}
  .slot-inner{display:flex;align-items:center;gap:12px}
  .slot.blocked{opacity:0.45;cursor:not-allowed;border-color:#E8E7E2;background:#F5F4F0}
  .slot.blocked:hover{border-color:#E8E7E2;background:#F5F4F0}
  .slot-blocked-label{font-size:11px;color:#999;font-weight:500;margin-left:auto;white-space:nowrap}
  .btn{width:100%;padding:16px;border-radius:10px;font-size:15px;font-weight:600;border:none;cursor:pointer;margin-top:8px;transition:all .2s}
  .btn-primary{background:#534AB7;color:#fff}
  .btn-primary:hover{background:#4239A3}
  .btn-primary:disabled{background:#C4C2E0;cursor:not-allowed}
  .msg{text-align:center;padding:40px 0;color:#666;font-size:14px;line-height:1.8}
  .success{text-align:center;padding:20px 0}
  .success-icon{font-size:48px;margin-bottom:16px}
  .success-title{font-size:20px;font-weight:700;color:#1a1a1a;margin-bottom:8px}
  .success-sub{font-size:14px;color:#666;line-height:1.6}
  .divider{height:1px;background:#E8E7E2;margin:24px 0}
</style>
</head>
<body>
<div class="card" id="app">
  <div class="loading" style="text-align:center;padding:60px 0;color:#666">
    <div style="font-size:32px;margin-bottom:12px">📅</div>
    <div>면접 일정을 불러오는 중...</div>
  </div>
</div>
<script>
const SUPABASE_URL = 'https://qiekooojogqifgzqagnb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_rxoD0FpAJ_fonVDTCZAfgg_jGZnMLQu';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const token = new URLSearchParams(location.search).get('token');
let selectedSlotId = null;
let selectionId = null;

const days = ['일','월','화','수','목','금','토'];
function formatDate(d) {
  const dt = new Date(d);
  return `${dt.getFullYear()}년 ${dt.getMonth()+1}월 ${dt.getDate()}일 (${days[dt.getDay()]})`;
}
function formatTime(t) {
  const [h,m] = t.split(':');
  const hour = parseInt(h);
  return `${hour < 12 ? '오전' : '오후'} ${hour <= 12 ? hour : hour-12}:${m}`;
}

const EDGE_FN_BASE = `${SUPABASE_URL}/functions/v1/`;

async function callEdgeFunction(name, body) {
  const res = await fetch(EDGE_FN_BASE + name, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'apikey': SUPABASE_KEY
    },
    body: JSON.stringify(body)
  });
  const data = await res.json().catch(() => ({}));
  return { ok: res.ok, status: res.status, data };
}

const EXPIRE_HOURS = 2; // 선택 제한 시간 (서버에서도 동일하게 재검증함)

async function init() {
  if (!token) { showError('유효하지 않은 링크입니다'); return; }

  const { ok, data } = await callEdgeFunction('get-interview-slots', { token });

  if (!ok || data.error) {
    showError(data.message || data.error || '유효하지 않은 링크이거나 만료되었습니다');
    return;
  }

  // 이미 선택 완료
  if (data.status === 'already_selected') {
    showAlreadySelected(data.name, data.slot);
    return;
  }

  // 이미 참석불가/미참석 응답 완료
  if (data.status === 'already_responded') {
    showAlreadyResponded(data.responseType);
    return;
  }

  // 만료까지 남은 시간 표시용 타이머 세팅
  window._expiresAt = new Date(data.expiresAt);
  window._currentToken = token;

  showSlots(data.name, data.round, data.slots);
}

function showSlots(name, round, slots) {
  window._slotsCache = { name, round, slots }; // 참석불가/미참석 화면에서 돌아오기용
  // 면접 라운드에 따라 안내 문구 분기
  const roundText = round === 2
    ? { title: '🎉 1차 면접 합격을 축하드립니다!', sub: `${name}님, 1차 면접에 합격하셨습니다.<br>아래 2차 면접 후보 일정 중 참석 가능한 시간을 <strong>선택</strong>해 주세요.` }
    : { title: '🎉 서류전형 합격을 축하드립니다!', sub: `${name}님, 서류전형에 합격하셨습니다.<br>아래 면접 후보 일정 중 참석 가능한 시간을 <strong>선택</strong>해 주세요.` };

  // 남은 시간 카운트다운
  const startTimer = () => {
    const el = document.getElementById('timerBadge');
    if (!el || !window._expiresAt) return;
    const diff = Math.max(0, window._expiresAt - new Date());
    const h = Math.floor(diff/3600000);
    const m = Math.floor((diff%3600000)/60000);
    const s = Math.floor((diff%60000)/1000);
    el.textContent = `⏱ 선택 가능 시간: ${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    if (diff <= 0) { el.textContent = '⏱ 시간 만료'; el.style.background = '#FCEBEB'; el.style.color = '#A32D2D'; document.getElementById('confirmBtn').disabled = true; }
    else setTimeout(startTimer, 1000);
  };

  document.getElementById('app').innerHTML = `
    <div class="logo">엘앤티렉서스(주) 채용</div>
    <h1>${roundText.title}</h1>
    <div class="sub">${roundText.sub}</div>
    <div id="timerBadge" style="background:#FEF3E2;color:#7A3D00;font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px;text-align:center;margin-bottom:16px">⏱ 로딩 중...</div>
    <div id="slotList">
      ${slots.map(s => `
        <div class="slot${s.is_blocked ? ' blocked' : ''}" id="slot-${s.id}" ${s.is_blocked ? '' : `onclick="selectSlot('${s.id}')"`}>
          <div class="slot-inner">
            <div style="flex:1">
              <div class="slot-date">${formatDate(s.slot_date)}</div>
              <div class="slot-time">${formatTime(s.slot_time)}${s.slot_time_end ? ' ~ ' + formatTime(s.slot_time_end) : ''}</div>
              ${s.slot_location ? `<div class="slot-location">📍 ${s.slot_location}</div>` : ''}
            </div>
            ${s.is_blocked ? '<span class="slot-blocked-label">⛔ 마감된 일정</span>' : '<span class="slot-check">✓</span>'}
          </div>
        </div>`).join('')}
    </div>
    <div class="divider"></div>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <button class="btn" style="flex:1;background:#fff;border:1.5px solid #E8E7E2;color:#666;font-size:13px;padding:11px 8px;line-height:1.4;margin-top:0" onclick="showUnavailableForm()">참석 불가<br><span style="font-size:11px;color:#999">참석 가능한 시간이 없음</span></button>
      <button class="btn" style="flex:1;background:#fff;border:1.5px solid #E8E7E2;color:#666;font-size:13px;padding:11px 8px;line-height:1.4;margin-top:0" onclick="showDeclineForm()">면접 포기<br><span style="font-size:11px;color:#999">면접에 참석하지 않음</span></button>
    </div>
    <button class="btn btn-primary" id="confirmBtn" onclick="confirmSelection()" disabled>선택 완료</button>
    <div style="font-size:12px;color:#999;text-align:center;margin-top:12px">선택 후 변경이 어렵습니다. 신중하게 선택해 주세요.</div>
    <div style="margin-top:20px;padding:14px;background:#F5F4F0;border-radius:10px;text-align:center">
      <div style="font-size:12px;color:#666;font-weight:600">엘앤티렉서스(주) 채용담당자</div>
      <div style="font-size:14px;color:#1a1a1a;font-weight:700;margin-top:4px">📞 02-2188-3565</div>
      <div style="font-size:11px;color:#999;margin-top:4px">문의사항이 있으시면 연락해 주세요</div>
    </div>
  `;
  setTimeout(startTimer, 100);
}

function selectSlot(id) {
  document.querySelectorAll('.slot').forEach(el => el.classList.remove('selected'));
  document.getElementById('slot-'+id).classList.add('selected');
  selectedSlotId = id;
  document.getElementById('confirmBtn').disabled = false;
}


// 담당자 알림: 잔디(JANDI)로만 발송 — confirm-interview-slot 함수(서버)에서 처리
// (EmailJS 제거: 공개키 악용 위험 + 개인정보 국외이전 이슈 원천 차단, 2026-08-25)

async function confirmSelection() {
  if (!selectedSlotId) return;
  const btn = document.getElementById('confirmBtn');
  btn.disabled = true; btn.textContent = '처리 중...';

  const { ok, data } = await callEdgeFunction('confirm-interview-slot', { token, slotId: selectedSlotId });

  if (!ok || data.error) {
    btn.disabled = false; btn.textContent = '선택 완료';
    alert(data.error || '오류가 발생했습니다. 다시 시도해주세요.');
    return;
  }

  const slot = document.querySelector('.slot.selected');
  const dateText = slot.querySelector('.slot-date').textContent;
  const timeText = slot.querySelector('.slot-time').textContent;
  const locText = slot.querySelector('.slot-location')?.textContent.replace(/^📍\s*/,'') || '';
  showSuccess(dateText, timeText, locText);
  // 면접관 확정 알림은 confirm-interview-slot 함수(서버)가 잔디로 발송함
}

// 확정된 면접 일정을 크게 보여주는 카드 (날짜·시간·장소)
function bigScheduleCard(date, time, loc) {
  return `
    <div style="background:#EEEDFE;border:2px solid #534AB7;border-radius:16px;padding:26px 20px;margin:18px 0;text-align:center">
      <div style="font-size:12px;font-weight:700;color:#534AB7;letter-spacing:0.08em;margin-bottom:12px">나의 면접 일정</div>
      <div style="font-size:22px;font-weight:800;color:#1a1a1a;line-height:1.4">📅 ${date}</div>
      <div style="font-size:26px;font-weight:800;color:#534AB7;margin-top:6px">⏰ ${time}</div>
      ${loc ? `
      <div style="margin-top:16px;padding-top:16px;border-top:1.5px dashed #C4C2E0">
        <div style="font-size:12px;font-weight:600;color:#666;margin-bottom:4px">면접 장소</div>
        <div style="font-size:19px;font-weight:800;color:#1a1a1a;line-height:1.5">📍 ${loc}</div>
      </div>` : ''}
    </div>`;
}

function showSuccess(date, time, loc) {
  document.getElementById('app').innerHTML = `
    <div class="logo">엘앤티렉서스(주) 채용</div>
    <div class="success">
      <div class="success-icon">🎉</div>
      <div class="success-title">면접 일정이 확정되었습니다</div>
      ${bigScheduleCard(date, time, loc)}
      <div class="success-sub">
        위 일정으로 면접이 진행됩니다. 일정과 장소를 꼭 확인해 주세요.<br>
        추가 안내는 이메일로 발송드립니다.<br><br>
        <div style="margin-top:12px;padding:12px;background:#F5F4F0;border-radius:10px">
          <div style="font-size:12px;font-weight:600">엘앤티렉서스(주) 채용담당자</div>
          <div style="font-size:14px;font-weight:700;margin-top:4px">📞 02-2188-3565</div>
        </div>
      </div>
    </div>
  `;
}

// ── 참석 불가 / 미참석 응답 ─────────────────────────────
function backToSlots() {
  const c = window._slotsCache;
  if (c) showSlots(c.name, c.round, c.slots);
}

function showUnavailableForm() {
  document.getElementById('app').innerHTML = `
    <div class="logo">엘앤티렉서스(주) 채용</div>
    <h1 style="font-size:20px">참석 가능한 시간이 없으신가요?</h1>
    <div class="sub" style="margin-top:8px;margin-bottom:16px">참석 가능하신 날짜와 시간대를 적어주시면<br>담당자가 일정을 조율한 뒤 다시 안내드리겠습니다.</div>
    <textarea id="availText" rows="4" placeholder="예) 8월 25일 오후 2시 이후, 8월 27일은 종일 가능합니다" style="width:100%;padding:14px;border:2px solid #E8E7E2;border-radius:12px;font-size:14px;font-family:inherit;resize:vertical;outline:none" onfocus="this.style.borderColor='#534AB7'" onblur="this.style.borderColor='#E8E7E2'"></textarea>
    <button class="btn btn-primary" style="margin-top:14px" onclick="submitUnavailable()">가능한 일정 보내기</button>
    <button class="btn" style="background:#F5F4F0;color:#666;margin-top:4px" onclick="backToSlots()">← 일정 선택으로 돌아가기</button>
  `;
}

async function submitUnavailable() {
  const text = document.getElementById('availText').value.trim();
  if (!text) { alert('참석 가능한 날짜/시간을 입력해 주세요'); return; }
  const btns = document.querySelectorAll('#app .btn'); btns.forEach(b => b.disabled = true);
  const { ok, data } = await callEdgeFunction('confirm-interview-slot', { token, responseType: 'unavailable', availableDates: text });
  if (!ok || data.error) {
    btns.forEach(b => b.disabled = false);
    alert(data.error || '오류가 발생했습니다. 다시 시도해주세요.');
    return;
  }
  document.getElementById('app').innerHTML = `
    <div class="logo">엘앤티렉서스(주) 채용</div>
    <div class="success">
      <div class="success-icon">📩</div>
      <div class="success-title">전달되었습니다</div>
      <div class="success-sub">보내주신 가능 일정을 담당자가 확인한 뒤<br>다시 안내드리겠습니다. 감사합니다.<br><br>
        <div style="margin-top:12px;padding:12px;background:#F5F4F0;border-radius:10px">
          <div style="font-size:12px;font-weight:600">엘앤티렉서스(주) 채용담당자</div>
          <div style="font-size:14px;font-weight:700;margin-top:4px">📞 02-2188-3565</div>
        </div>
      </div>
    </div>`;
}

let _declineReason = null;
function showDeclineForm() {
  _declineReason = null;
  document.getElementById('app').innerHTML = `
    <div class="logo">엘앤티렉서스(주) 채용</div>
    <h1 style="font-size:20px">면접을 포기하시겠어요?</h1>
    <div class="sub" style="margin-top:8px;margin-bottom:16px">사유를 선택해 주시면 처리에 참고하겠습니다.</div>
    <div class="slot" id="rsn0" onclick="selectReason(0)"><div class="slot-inner"><div style="flex:1"><div class="slot-date">타사 이직 완료</div></div><span class="slot-check">✓</span></div></div>
    <div class="slot" id="rsn1" onclick="selectReason(1)"><div class="slot-inner"><div style="flex:1"><div class="slot-date">기타</div></div><span class="slot-check">✓</span></div></div>
    <textarea id="declineDetail" rows="3" placeholder="사유를 적어주세요 (선택사항)" style="display:none;width:100%;padding:14px;border:2px solid #E8E7E2;border-radius:12px;font-size:14px;font-family:inherit;resize:vertical;outline:none;margin-top:4px" onfocus="this.style.borderColor='#534AB7'" onblur="this.style.borderColor='#E8E7E2'"></textarea>
    <button class="btn btn-primary" id="declineBtn" style="margin-top:14px" onclick="submitDecline()" disabled>면접 포기 제출</button>
    <button class="btn" style="background:#F5F4F0;color:#666;margin-top:4px" onclick="backToSlots()">← 일정 선택으로 돌아가기</button>
  `;
}

const DECLINE_REASONS = ['타사 이직 완료', '기타'];
function selectReason(idx) {
  _declineReason = DECLINE_REASONS[idx];
  document.querySelectorAll('[id^="rsn"]').forEach(el => el.classList.remove('selected'));
  document.getElementById('rsn' + idx).classList.add('selected');
  document.getElementById('declineDetail').style.display = _declineReason === '기타' ? 'block' : 'none';
  document.getElementById('declineBtn').disabled = false;
}

async function submitDecline() {
  if (!_declineReason) return;
  if (!confirm('면접 포기로 제출하시겠습니까?\n제출 후에는 변경이 어렵습니다.')) return;
  const detail = document.getElementById('declineDetail')?.value.trim() || '';
  const btns = document.querySelectorAll('#app .btn'); btns.forEach(b => b.disabled = true);
  const { ok, data } = await callEdgeFunction('confirm-interview-slot', { token, responseType: 'declined', reason: _declineReason, reasonDetail: detail });
  if (!ok || data.error) {
    btns.forEach(b => b.disabled = false);
    alert(data.error || '오류가 발생했습니다. 다시 시도해주세요.');
    return;
  }
  document.getElementById('app').innerHTML = `
    <div class="logo">엘앤티렉서스(주) 채용</div>
    <div class="success">
      <div class="success-icon">🙏</div>
      <div class="success-title">확인되었습니다</div>
      <div class="success-sub">면접 포기 의사가 전달되었습니다.<br>지원해 주셔서 진심으로 감사드리며,<br>더 좋은 기회로 다시 만나뵙기를 바랍니다.</div>
    </div>`;
}

function showAlreadyResponded(type) {
  const msg = type === 'declined'
    ? '이미 면접 포기 의사를 제출하셨습니다.<br>변경을 원하시면 담당자에게 연락해 주세요.'
    : '참석 가능 일정을 이미 보내주셨습니다.<br>담당자가 확인 후 다시 안내드리겠습니다.';
  document.getElementById('app').innerHTML = `
    <div class="logo">엘앤티렉서스(주) 채용</div>
    <div class="success">
      <div class="success-icon">✅</div>
      <div class="success-title">이미 응답을 완료하셨습니다</div>
      <div class="success-sub">${msg}<br><br>
        <div style="margin-top:12px;padding:12px;background:#F5F4F0;border-radius:10px">
          <div style="font-size:12px;font-weight:600">엘앤티렉서스(주) 채용담당자</div>
          <div style="font-size:14px;font-weight:700;margin-top:4px">📞 02-2188-3565</div>
        </div>
      </div>
    </div>`;
}

function showAlreadySelected(name, slot) {
  const date = slot ? formatDate(slot.slot_date) : '-';
  const time = slot ? formatTime(slot.slot_time) + (slot.slot_time_end ? ' ~ ' + formatTime(slot.slot_time_end) : '') : '-';
  document.getElementById('app').innerHTML = `
    <div class="logo">엘앤티렉서스(주) 채용</div>
    <div class="success">
      <div class="success-icon">✅</div>
      <div class="success-title">면접 일정이 확정되어 있습니다</div>
      ${bigScheduleCard(date, time, slot?.slot_location || '')}
      <div class="success-sub">
        일정 변경이 필요하시면 채용담당자에게 연락해 주세요.<br><br>
        <div style="margin-top:12px;padding:12px;background:#F5F4F0;border-radius:10px">
          <div style="font-size:12px;font-weight:600">엘앤티렉서스(주) 채용담당자</div>
          <div style="font-size:14px;font-weight:700;margin-top:4px">📞 02-2188-3565</div>
        </div>
      </div>
    </div>
  `;
}

function showError(msg) {
  document.getElementById('app').innerHTML = `
    <div class="logo">엘앤티렉서스(주) 채용</div>
    <div class="msg">
      <div style="font-size:32px;margin-bottom:12px">❌</div>
      ${msg.replace(/\n/g,'<br>')}
    </div>
  `;
}

init();
</script>
